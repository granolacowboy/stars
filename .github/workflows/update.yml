name: Update stars index
on:
  schedule:
    - cron: '0 6 * * 1'   # weekly, Mondays 06:00 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stars-index-refresh
  cancel-in-progress: true

jobs:
  update:
    runs-on: [self-hosted, gcd]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run offline generator tests
        run: python -m unittest discover -s tests -v
      - name: Generate index
        env:
          GH_TOKEN: ${{ secrets.STARS_TOKEN }}   # classic PAT with read:user
        run: |
          test -n "$GH_TOKEN" || { echo "::error::STARS_TOKEN is not configured"; exit 1; }
          python scripts/generate.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "chore: refresh stars index"; git push; }
